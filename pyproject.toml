[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freedom-decision-kernel"
version = "0.3.0"
description = "The legitimacy layer above authorization — decides if an AI action is permissible under property-rights axioms, before AuthGate checks authority."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ali Pourrahim", email = "Alipourrahim.ap@gmail.com" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
keywords = ["ai-safety", "ai-ethics", "authorization", "agents", "decision-kernel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/fdk_kernel", "src/fdk_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# The codebase intentionally uses typographic Unicode in prose/docstrings
# (en-dash in "A1–A7", minus sign in "after − before"). These are correct, not
# confusable bugs, so the ambiguous-character lints are disabled deliberately.
ignore = ["RUF001", "RUF002", "RUF003", "RUF022"]  # intentional Unicode + category-grouped __all__

[tool.ruff.lint.per-file-ignores]
# Test fixtures favor dense, readable single-line action construction.
"tests/**" = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["fdk_kernel", "fdk_research"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
partial_branches = ["pragma: no branch"]
