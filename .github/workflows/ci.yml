name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + types + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests examples redteam

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests + coverage gate (100%)
        run: pytest --cov=fdk_kernel --cov=fdk_research --cov-report=term-missing --cov-fail-under=100

  lean:
    name: Lean proofs (formal/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build + check the proofs (zero sorry)
        working-directory: formal
        run: lake build Fdk

  tlc:
    name: TLA+ model check (spec/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download TLC (tla2tools)
        run: curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Model-check the safety invariants
        working-directory: spec
        run: java -cp ../tla2tools.jar tlc2.TLC -config MC_fdk.cfg MC_fdk.tla
